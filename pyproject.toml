[project]
name = "bank_operations"
version = "0.1.0"
description = "Project for bank operations with tests"
authors = [
    {name = "Elena", email = "elenka.sazonova.94@mail.ru"}
]
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=1.10.0,<2.0.0)",
    "isort (>=5.13.0,<6.0.0)",
    "black (>=23.0.0,<24.0.0)"
]

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'

[tool.black]
line-length = 119
exclude = '''
(
/(
\.eggs
| \.git
| \.hg
| \.mypy_cache
| \.tox
| \.venv
| dist
)/
| foo.py
)
'''

[tool.isort]
line-length = 119

[mypy]
ignore_missing_imports = true

[tool.poetry]
package-mode = false